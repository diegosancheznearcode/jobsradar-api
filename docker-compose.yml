services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobsradar
      POSTGRES_PASSWORD: jobsradar
      POSTGRES_DB: jobsradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://jobsradar:jobsradar@postgres:5432/jobsradar
      REDIS_URL: redis://redis:6379
      # 5174, no 5173 (default de Vite): en esta máquina 5173 ya lo ocupa
      # otro proyecto, así que jobsradar-web fija --port 5174 --strictPort
      # en su script "dev" para no terminar en un puerto impredecible.
      ALLOWED_ORIGINS: http://localhost:5174
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # BrowserClient (Fase 4) hace el login interactivo fuera de Docker (necesita
    # una persona completando el login en un navegador real, no headless) y
    # escribe storageState.json en el host — acá solo se monta de solo lectura
    # para que HttpClient arme el header Cookie (packages/adapter-wellfound/src/
    # session.ts). Si el archivo no existe, el worker igual arranca: solo se
    # queda sin poder enriquecer /company/{slug} (founders/market/website) hasta
    # que exista (ver sección 6.2 y Fase 9 resultado en ARCHITECTURE.md).
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://jobsradar:jobsradar@postgres:5432/jobsradar
      REDIS_URL: redis://redis:6379
      WELLFOUND_STORAGE_STATE_PATH: /repo/storageState.json
    volumes:
      - ./storageState.json:/repo/storageState.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
