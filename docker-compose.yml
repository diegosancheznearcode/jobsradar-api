services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobsradar
      POSTGRES_PASSWORD: jobsradar
      POSTGRES_DB: jobsradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://jobsradar:jobsradar@postgres:5432/jobsradar
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Fase 0 confirmó que Playwright es necesario para el login/renovación de
    # sesión (sección 6.2); la imagen base se ajusta cuando se implemente
    # BrowserClient en la Fase 4.
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://jobsradar:jobsradar@postgres:5432/jobsradar
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
