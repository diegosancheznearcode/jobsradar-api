name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm viene del campo "packageManager" de package.json
      # (pnpm@11.24.0) — no se repite aquí para evitar ERR_PNPM_BAD_PM_VERSION
      # por versiones en conflicto.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/domain y apps/* resuelven @jobsradar/contracts vía su
      # dist/ (package.json "types"/"main"), no contra el código fuente —
      # dist/ está en .gitignore, así que en un checkout limpio no existe
      # hasta compilar. pnpm build respeta el orden topológico del workspace
      # (contracts -> domain -> api/worker), por eso va antes de typecheck.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
