name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # packages/repository-postgres y apps/worker prueban contra Postgres
    # real (Fase 5) — sección 11 no cubre SQL explícitamente, y mockear
    # postgres.js no probaría el merge/idempotencia/caché de verdad.
    # packages/events-redis prueba contra Redis real (Fase 6, pub/sub).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsradar
          POSTGRES_PASSWORD: jobsradar
          POSTGRES_DB: jobsradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://jobsradar:jobsradar@localhost:5432/jobsradar
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm viene del campo "packageManager" de package.json
      # (pnpm@11.24.0) — no se repite aquí para evitar ERR_PNPM_BAD_PM_VERSION
      # por versiones en conflicto.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/domain y apps/* resuelven @diegosancheznearcode/contracts vía su
      # dist/ (package.json "types"/"main"), no contra el código fuente —
      # dist/ está en .gitignore, así que en un checkout limpio no existe
      # hasta compilar. pnpm build respeta el orden topológico del workspace
      # (contracts -> domain -> api/worker), por eso va antes de typecheck.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  # apps/api y apps/worker se despliegan como imágenes Docker (docker-compose.yml,
  # sección 9), pero nada más en este workflow ejecuta `docker build` — así
  # pasaron desapercibidos, durante varias fases, dos Dockerfiles que nunca
  # hubieran buildeado (lockfile no copiado, paquetes intermedios faltantes,
  # ver ARCHITECTURE.md Fase 9). Este job cierra ese hueco.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t jobsradar-api:ci .
      - run: docker build -f apps/worker/Dockerfile -t jobsradar-worker:ci .

  publish-contracts:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # "packages: write" ya no alcanza acá: desde que el repo se transfirió
      # de diegosancheznearcode (cuenta personal) a nearcodecr (org), el
      # GITHUB_TOKEN automático de este workflow pertenece a nearcodecr, pero
      # @diegosancheznearcode/contracts se sigue publicando bajo la cuenta
      # personal original (decisión del equipo, ver .npmrc y el Dockerfile de
      # jobsradar-web — mismo motivo que justifica el secret
      # JRW_GH_PACKAGES_TOKEN ahí: no se renombró el paquete). GitHub
      # Packages exige ser colaborador explícito CON ESCRITURA del paquete
      # para publicar — un GITHUB_TOKEN de otra cuenta/org da 403 "Permission
      # permission_denied: The requested installation does not exist"
      # (confirmado: los 3 pushes a main desde la transferencia fallaron acá,
      # aunque build-test y docker-build siguieron en verde). CONTRACTS_PUBLISH_TOKEN
      # es un classic PAT con scope write:packages (y read:packages, lo usa
      # `npm view` más abajo) generado desde la cuenta diegosancheznearcode.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@diegosancheznearcode"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @diegosancheznearcode/contracts build

      # Publica solo si la versión en package.json todavía no existe en el
      # registro — evita que `npm publish` falle en cada push a main cuando
      # no hubo bump de versión (ver ARCHITECTURE.md sección 9, nota de
      # Fase 9). Bumpear la versión de packages/contracts/package.json
      # cuando el contrato cambie es lo que dispara una publicación nueva.
      - name: Publish si la versión cambió
        working-directory: packages/contracts
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @diegosancheznearcode/contracts version 2>/dev/null || echo "none")
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "Publicando $LOCAL_VERSION (registro tiene: $PUBLISHED_VERSION)"
            npm publish
          else
            echo "Versión $LOCAL_VERSION ya publicada, nada que hacer."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CONTRACTS_PUBLISH_TOKEN }}
